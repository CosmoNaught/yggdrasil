name: deltaproduct2-hg38
description: medium size; objective = -validation bits per token
method: bayes
metric: {name: objective, goal: maximize}
run_cap: 8
parameters:
  model: {value: deltaproduct2}
  task: {value: hg38}
  steps: {value: 10000}
  eval_every: {value: 2000}
  test_tokens: {value: 500000}
  seed: {value: 0}
  d_model: {value: 48}
  n_layers: {value: 2}
  head_dim: {value: 16}
  n_heads: {value: 3}
  d_ff: {value: 128}
  lr: {distribution: log_uniform_values, min: 0.0005, max: 0.02}
  weight_decay:
    values: [0.0, 0.01, 0.1]
  beta2:
    values: [0.95, 0.99, 0.999]
