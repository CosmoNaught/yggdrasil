name: mamba2-modular_arithmetic
description: objective = validation final-answer accuracy, scaled to 0 at chance and 1 at perfect
method: bayes
metric: {name: objective, goal: maximize}
run_cap: 8
parameters:
  model: {value: mamba2}
  task: {value: modular_arithmetic}
  steps: {value: 10000}
  eval_every: {value: 2000}
  seed: {value: 160}
  lr: {distribution: log_uniform_values, min: 0.0005, max: 0.02}
  weight_decay:
    values: [0.0, 0.01, 0.1]
  beta2:
    values: [0.95, 0.99, 0.999]
  n_layers:
    values: [1, 2, 4]
  d_model:
    values: [64, 128, 256]
  d_state:
    values: [16, 32, 64]
