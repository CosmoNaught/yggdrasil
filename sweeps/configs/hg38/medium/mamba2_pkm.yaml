name: mamba2_pkm-hg38
description: medium size; objective = -validation bits per token
method: bayes
metric: {name: objective, goal: maximize}
run_cap: 8
parameters:
  model: {value: mamba2_pkm}
  task: {value: hg38}
  steps: {value: 10000}
  eval_every: {value: 2000}
  test_tokens: {value: 500000}
  seed: {value: 0}
  d_model: {value: 40}
  n_layers: {value: 2}
  d_state: {value: 112}
  head_dim: {value: 8}
  pkm_keys: {value: 1140}
  pkm_qdim: {value: 32}
  lr: {distribution: log_uniform_values, min: 0.0005, max: 0.08}
  weight_decay:
    values: [0.0, 0.01, 0.1]
  beta2:
    values: [0.95, 0.99, 0.999]
  pkm_heads:
    values: [1, 2, 4]
  pkm_topk:
    values: [8, 16, 32]
